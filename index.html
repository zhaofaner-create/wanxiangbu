<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>万象簿</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- 下面这几行是给 PWA（安装到桌面/离线缓存）用的：直接双击本文件（file:// 打开）
       完全不受影响——manifest/图标只是普通同源资源，浏览器会照常加载；真正需要
       "安全上下文"（http(s) 或 localhost）的 Service Worker 注册脚本在下面 body
       末尾有单独的 file:// 判断守卫，file:// 下会直接跳过、不注册、不报错。 -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#e7dcc8" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" id="sidebar">
      <div class="app-brand">
        <span class="app-brand-icon">
          <svg viewBox="0 0 150 150" aria-hidden="true">
            <path d="M30 94 Q16 102 20 116" stroke="#5c4a37" stroke-width="4.5" fill="none" stroke-linecap="round"/>
            <circle cx="19" cy="118" r="3" fill="#5c4a37"/>
            <circle cx="58" cy="52" r="25" fill="#5e4a35"/>
            <path d="M34 96 C30 70, 54 52, 84 54 C108 56, 122 72, 120 92 C119 104, 111 111, 99 112 L44 112 C37 112, 33 106, 34 96 Z" fill="#7a6249"/>
            <circle cx="103" cy="60" r="19" fill="#7a6249"/>
            <circle cx="109" cy="55" r="2.8" fill="#f3ede4"/>
            <path d="M119 65 C132 72, 135 90, 124 101 C118 107, 109 107, 105 100" stroke="#7a6249" stroke-width="12" fill="none" stroke-linecap="round"/>
            <rect x="44" y="110" width="13" height="22" rx="6" fill="#5c4a37"/>
            <rect x="66" y="110" width="13" height="22" rx="6" fill="#5c4a37"/>
            <rect x="90" y="110" width="13" height="22" rx="6" fill="#5c4a37"/>
            <rect x="55" y="58" width="42" height="27" rx="4" fill="#f3ede4" stroke="#5c4a37" stroke-width="2.5"/>
            <line x1="55" y1="65" x2="97" y2="65" stroke="#5c4a37" stroke-width="2"/>
            <line x1="61" y1="71.5" x2="91" y2="71.5" stroke="#c9bba5" stroke-width="2"/>
            <line x1="61" y1="78" x2="85" y2="78" stroke="#c9bba5" stroke-width="2"/>
          </svg>
        </span>
        <span class="app-brand-name">万象簿</span>
      </div>
      <div class="nav-list" id="nav-list"></div>
      <button class="sidebar-profile" id="sidebar-profile" type="button">
        <span class="profile-avatar" id="sidebar-profile-avatar">🙂</span>
        <span class="sidebar-profile-name" id="sidebar-profile-name">设置昵称</span>
      </button>
    </nav>
    <div class="nav-backdrop" id="nav-backdrop"></div>
    <div class="main-area">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="打开导航菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="topbar-text">
          <div class="topbar-title" id="topbar-title"></div>
          <div class="topbar-subtitle" id="topbar-subtitle"></div>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换白天/夜间模式">
          <svg class="theme-toggle-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2.2M12 18.8V21M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M3 12h2.2M18.8 12H21M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
          <svg class="theme-toggle-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>
        </button>
      </header>
      <main class="content-area" id="content-area"></main>
    </div>
  </div>
  <script>
    // 经典 <script> 加载的模块命名空间垫片：所有 js/*.js 文件都以
    // window.FanerApp.<名字> 的形式挂载，这里模拟一个极简的 require()，
    // 让每个文件都能写成"看起来像 CommonJS"的写法（同一份源码在 Node
    // 测试里用真正的 require，在浏览器里用这个垫片，两边逻辑保证一致）。
    // 之所以不用 <script type="module">：Chromium 在 file:// 协议下
    // 会因为 CORS 策略直接拒绝加载 ES Module 脚本，双击打开 index.html
    // 时页面会整个空白——这是本项目最核心的使用场景，因此改用经典脚本。
    window.FanerApp = window.FanerApp || {};
    window.__fanerRequire = function (path) {
      var name = path.replace(/^.*\//, "").replace(/\.js$/, "");
      var ns = window.FanerApp[name];
      if (!ns) {
        throw new Error("FanerApp module not loaded yet: " + name + " (required from " + path + ")");
      }
      return ns;
    };
  </script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/derived.js"></script>
  <script src="js/components/dom.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/confirm.js"></script>
  <script src="js/components/quickMemo.js"></script>
  <script src="js/components/segmented.js"></script>
  <script src="js/components/odometer.js"></script>
  <script src="js/components/imageCrop.js"></script>
  <script src="js/components/avatarCropper.js"></script>
  <script src="js/components/markdown.js"></script>
  <script src="js/components/audioStore.js"></script>
  <script src="js/components/materialsStore.js"></script>
  <script src="js/components/pptxText.js"></script>
  <script src="js/components/mindMap.js"></script>
  <script src="js/components/speechRecorder.js"></script>
  <script src="js/aiClient.js"></script>
  <script src="js/translationProviders.js"></script>
  <script src="js/modules/home.js"></script>
  <script src="js/modules/todayPlan.js"></script>
  <script src="js/modules/studyTasks.js"></script>
  <script src="js/modules/reminders.js"></script>
  <script src="js/modules/mealPlan.js"></script>
  <script src="js/modules/inventory.js"></script>
  <script src="js/modules/finance.js"></script>
  <script src="js/modules/games.js"></script>
  <script src="js/modules/readingNotes.js"></script>
  <script src="js/modules/classNotes.js"></script>
  <script src="js/modules/profile.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Service Worker 只在"安全上下文"（http(s) 或 localhost）下才允许注册，
    // file:// 直接双击打开时这里会跳过，不影响、也不改变现有的离线使用方式。
    if (typeof navigator !== "undefined" && "serviceWorker" in navigator && window.location.protocol !== "file:") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
